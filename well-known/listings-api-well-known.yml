notes: >-
  Real hits on all three hosts. listingsapi.com serves RFC 9116 security.txt plus RFC 8414
  oauth-authorization-server and RFC 9728 oauth-protected-resource metadata for the MCP server
  (resource https://listingsapi.com/mcp, scopes read/write, PKCE S256, dynamic client
  registration). docs.listingsapi.com serves byte-identical copies of all three.
  www.listingsapi.com serves an RFC 9727 api-catalog linkset (anchor https://listingsapi.com/api/v4,
  service-desc https://listingsapi.com/openapi.yaml), a separate oauth-protected-resource doc for
  the REST API (no authorization_servers - API keys only, documented at /auth.md), and an
  agent-skills discovery index at /.well-known/agent-skills/index.json pointing at a provider-
  published SKILL.md (saved verbatim in skills/). No A2A agent card on any host (agent-card.json
  and agent.json 404 everywhere; the 404 bodies are the site's HTML 404 page, not an SPA
  catch-all 200).

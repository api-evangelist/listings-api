                    globalPostSchedule: 2026-10-02 13:30:00+00:00
                    customDataFlag: false
                    approvalState: null
                    actionOn: null
                    comment: null
                    postAutomationId: null
                    connectedChannels:
                    - id: b81d5b3c-4a90-4f6a-9c11-71e0dd2fa4a7
                      platform: INSTAGRAM
                      socialPlatformId: 2

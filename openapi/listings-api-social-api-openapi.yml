    AccountUsageType:
      type: object
      description: 'Usage for the current billing period. `connections` is the billable count that `maxConnections` is compared against: it is `connectionsActive` plus `connectionsReleased`, because a released connection slot is held until the end of the billing period. `connectionsActive` is what is connected right now; `connectionsReleased` is what was disconnected during this period, directly or by archiving its brand, and returns to the pool at renewal. A slot is held per brand-and-account pair: relinking the same account to the same brand reuses its slot and costs nothing, while attaching it to a different brand takes a separate slot. `brands` is informational, since brands are unlimited on every API plan.'
      properties:
        brands:
          type: integer
          format: int32
        connections:
          type: integer
          format: int32
        connectionsActive:
          type: integer
          format: int32
        connectionsReleased:
          type: integer

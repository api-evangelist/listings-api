        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      description: Returns a paginated list of a brand's social posts with their content, schedule, platforms and per-channel status.
  /api/v4/social/posts/{postId}:
    get:
      operationId: getSocialMediaPost
      summary: getSocialMediaPost

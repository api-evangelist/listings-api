          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      description: Returns one social brand with its profile details, timezone, archival state and connected-channel count.
  /api/v4/social/brands/{brandId}/connections/link:
    post:
      operationId: connectSocialAccount
      summary: Return OAuth connect URLs for a given social profile + channel
      tags:
      - Social
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: string
        description: Brand UUID the connection will be attached to.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      connectSocialAccount:
                        $ref: '#/components/schemas/ConnectInfoType'
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  connectSocialAccount:
                    status: success
                    url: https://social.listingsapi.com/connect/start?token=bfac8e06-8d72-4810-9c50-ae7ee12a7b52
                    title: null
                    token: null
                    expiresIn: 900
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:

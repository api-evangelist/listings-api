        '403':
          description: Forbidden — the key is valid but not permitted for this resource or operation (`SY90003`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit exceeded. Wait `retry_after_seconds` (or the `Retry-After` header) and retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  $ref: '#/components/schemas/PlatformEnum'
                redirectUrl:
                  type: string
                errorUrl:
                  type: string
                state:
                  type: string
              required:
              - channel
              - redirectUrl
            example:
              channel: INSTAGRAM
              redirectUrl: https://app.example.com/social/connected
              errorUrl: https://app.example.com/social/connect-failed
              state: sess_9f2c1e64
      description: Returns a short-lived hosted URL that walks an end user through connecting one social platform to a brand.

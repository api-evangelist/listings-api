openapi: 3.2.0
info:
  title: Listings Social API
  version: 2026-09-09
  description: 'REST API for managing business locations: sync listings across Google, Facebook, Bing and other publishers, respond to reviews, publish posts, and pull local search analytics. Authenticate with an API key from the developer dashboard.


    Try the sandbox day pass, no card required, when it is offered: sign up at https://listingsapi.com/signup?plan=day-pass&campaign=daypass. It covers the locations and listings endpoints and syncs only to listingsAPI demo directories. Agents can use the Day pass operations, which need no key; see https://listingsapi.com/docs/day-pass.'
  contact:
    name: Listings API support
    email: support@listingsapi.com
    url: https://www.listingsapi.com/contact
  termsOfService: https://www.listingsapi.com/terms
  license:
    name: Proprietary (Listings API Terms of Service)
    url: https://www.listingsapi.com/terms
  x-logo:
    url: https://www.listingsapi.com/favicon.svg
servers:
- url: https://listingsapi.com
  description: Production
security:
- apiKey: []
- rapidApiKey: []
  rapidApiHost: []
tags:
- name: Social
  description: Brand-level social publishing across Facebook, Instagram, X, LinkedIn and Pinterest — connect channels, schedule posts, and read engagement.
paths:
  /api/v4/social/brands:
    get:
      operationId: listSocialProfiles
      summary: List social profiles with optional filter and pagination
      tags:
      - Social
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: 'JSON-encoded filter object with two fields. `statuses` (array of strings, **required inside the object**) selects which brand states to return: `ACTIVE` or `ARCHIVED`. `profileName` (string, optional) is a case-insensitive substring match on the brand name. Omit the parameter entirely to return active brands.'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: 1-based page number. Defaults to 1.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Rows per page. Defaults to 20.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      listSocialProfiles:
                        $ref: '#/components/schemas/ProfileType'
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  listSocialProfiles:
                    profiles:
                    - id: 6f2c9a41-7b0e-4d55-9a2f-3c8e1d47b902
                      profileName: Jenny Home
                      archived: false
                      logo: null
                      profileLogo: null
                      siteUrl: https://jennyhome.example
                      countryIso: US
                      bio: Handmade furniture for real homes.
                      businessIntent: A family-run home furnishings store selling handmade furniture and textiles.
                      categories:
                      - Furniture Store
                      - Home Goods
                      brandHashtags:
                      - jennyhome
                      - handmadefurniture
                      competitorHashtags: []
                      connectedChannelCount: 3
                      timezone:
                        label: (GMT-05:00) Eastern Time
                        tzCode: America/New_York
                        name: Eastern Standard Time
                        utc: -05:00
                      contentPreferredLanguage: en
                    - id: a90f7c22-5db1-4e83-9f40-2b7c6a1e5d33
                      profileName: Jenny Home Eastside
                      archived: false
                      logo: null
                      profileLogo: null
                      siteUrl: null
                      countryIso: US
                      bio: null
                      businessIntent: general
                      categories: []
                      brandHashtags: []
                      competitorHashtags: []
                      connectedChannelCount: 0
                      timezone:
                        label: (GMT-06:00) Central Time
                        tzCode: America/Chicago
                        name: Central Standard Time
                        utc: -06:00
                      contentPreferredLanguage: en
                    pageInfo:
                      total: 11
                      hasNextPage: true
                      totalEngagementPosts: 0
                      totalPublishedPosts: 0
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorObject'
        '401':
          description: Unauthorized — the API key is missing, malformed, or revoked (`SY90005`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden — the key is valid but not permitted for this resource or operation (`SY90003`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit exceeded. Wait `retry_after_seconds` (or the `Retry-After` header) and retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      description: Returns a paginated list of the social brands on your account, with each brand's profile, timezone and connected-channel count.
    post:
      operationId: createSocialProfile
      summary: createSocialProfile
      tags:
      - Social
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      createSocialProfile:
                        $ref: '#/components/schemas/CreateSocialProfileMutation'
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  createSocialProfile:
                    success: true
                    error: null
                    socialProfile:
                      id: 6f2c9a41-7b0e-4d55-9a2f-3c8e1d47b902
                      profileName: Jenny Home
                      archived: false
                      logo: null
                      profileLogo: null
                      siteUrl: https://jennyhome.example
                      countryIso: US
                      bio: Handmade furniture for real homes.
                      businessIntent: A family-run home furnishings store selling handmade furniture and textiles.
                      categories:
                      - Furniture Store
                      - Home Goods
                      brandHashtags:
                      - jennyhome
                      - handmadefurniture
                      competitorHashtags: []
                      connectedChannelCount: 0
                      timezone:
                        label: (GMT-05:00) Eastern Time
                        tzCode: America/New_York
                        name: Eastern Standard Time
                        utc: -05:00
                      contentPreferredLanguage: en
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorObject'
        '401':
          description: Unauthorized — the API key is missing, malformed, or revoked (`SY90005`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden — the key is valid but not permitted for this resource or operation (`SY90003`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit exceeded. Wait `retry_after_seconds` (or the `Retry-After` header) and retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  $ref: '#/components/schemas/CreateSocialProfileInputType'
              required:
              - input
            example:
              input:
                profileName: Jenny Home
                timezone:
                  label: (GMT-05:00) Eastern Time
                  tzCode: America/New_York
                  name: Eastern Standard Time
                  utc: -05:00
                businessIntent: A family-run home furnishings store selling handmade furniture and textiles.
                categories:
                - Furniture Store
                - Home Goods
                siteUrl: https://jennyhome.example
                countryIso: US
                bio: Handmade furniture for real homes.
                brandHashtags:
                - jennyhome
                - handmadefurniture
      description: Creates a social brand, the container that owns connected social accounts and the posts published from them. Brands are unlimited on API plans.
  /api/v4/social/brands/{brandId}:
    get:
      operationId: getSocialProfileDetails
      summary: Fetch summary details for a single social profile
      tags:

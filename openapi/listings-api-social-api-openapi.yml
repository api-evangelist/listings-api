components:
  schemas:
    ApiErrorResponse:
      type: object
      description: Error response with an `errors` array, returned for most failures. The HTTP status is derived from the error codes, and `data` is present (usually with the operation key set to `null`).
      required:
      - errors
      properties:
        data:
          type:
          - object
          - 'null'
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
    SocialNetworkPageInfoType:
      type: object
      properties:
        total:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
        totalEngagementPosts:
          type: integer
          format: int32
        totalPublishedPosts:
          type: integer
          format: int32
    UpdateSocialProfileInputType:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
        profileName:
          type: string
        timezone:
          $ref: '#/components/schemas/SocialTimezoneInputType'
        logo:
          type: string
        siteUrl:
          type: string
        countryIso:
          type: string
        bio:
          type: string
        businessIntent:
          type: string
        categories:
          type: array
          items:
            type: string
        brandHashtags:
          type: array
          items:
            type: string
        competitorHashtags:
          type: array
          items:
            type: string
        contentPreferredLanguage:
          type: string
      required:
      - profileId
    RateLimitError:
      type: object
      description: Rate-limit error response. Also carries the `Retry-After` header and the `RateLimit-*` headers.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - RATE_LIMITED
            message:
              type: string
            retry_after_seconds:
              type: integer
              description: Seconds to wait before retrying. Never less than 1.
            limiting_window:
              type: string
              description: Which window was exhausted, e.g. `minute`, `hour`, `day`.
            correlation_id:
              type: string
              description: Request identifier to quote in support requests.
            doc_url:
              type: string
              format: uri
    ApiErrorObject:
      type: object
      description: Error response with a single `error` object, returned when a request is rejected before it runs.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable code, e.g. `INTERNAL_SERVER_ERROR`, `ambiguous_sub_category`, `unknown_sub_category`, or an `SYxxxxx` code.
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Extra context, e.g. the ambiguous query and its candidate categories.
    ChannelExtraParamsType:
      type: object
      properties:
        twitterThread:
          type: boolean
        threads:
          type: array
          items:
            type: string
        contentImageLink:
          type: string
    BulkSocialPostRowInput:
      type: object
      description: One post, for a single brand, fanned out to the platforms listed.

      description: Returns the social accounts connected to a brand, with the platform, display name and archival state of each.
  /api/v4/social/brands/{brandId}/posts:
    get:
      operationId: getSocialMediaPostByList
      summary: getSocialMediaPostByList
      tags:
      - Social
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: string
        description: Brand UUID whose posts should be listed.
      - name: filters
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: 'JSON-encoded filter object. Fields: `name` (substring match on the post''s internal name), `platforms` (array of the platform enum), `status` (array of `DRAFT`, `PENDING`, `SCHEDULED`, `PUBLISHED`, `FAILED`, `ARCHIVED`, `REJECTED`), `startDate` and `endDate` (`YYYY-MM-DD`, filtering on the post''s schedule in the brand''s timezone), `socialConnectedChannelId` (one connection), `approvalState` (array of workflow states), `viewMode` (string) and `filterByUser` (boolean, defaults to false).'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: 1-based page number. Defaults to 1.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Rows per page. Defaults to 20.
      - name: fetchPostContent
        in: query
        required: false
        schema:
          type: boolean
        description: When `true`, each row carries its full `content` object. Leave it off for a lighter list.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      getSocialMediaPostByList:
                        $ref: '#/components/schemas/SocialPostMetaType'
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  getSocialMediaPostByList:
                    socialPosts:
                    - socialPostId: c47a1e58-2b93-4f10-a6d7-58e0c9b12345
                      name: Autumn collection launch
                      status: PUBLISHED
                      platforms:
                      - INSTAGRAM
                      - FACEBOOK
                      - LINKEDIN
                      socialPlatformIds:
                      - 2
                      - 1
                      - 4
                      socialProfileDetailsId: 6f2c9a41-7b0e-4d55-9a2f-3c8e1d47b902
                      createdAt: 2026-09-28 14:02:11+00:00
                      createdBy: 40122
                      author: Dana Reyes
                      approver: null
                      approvalState: null
                      actionOn: null
                      actionBy: null
                      publishedOn: 2026-10-02 13:30:04+00:00
                      postAutomationId: null
                      content:
                        message: Our autumn collection lands today. Solid oak, hand-finished, made two blocks from the shop.
                        images:
                        - https://cdn.example.com/social/autumn-collection.jpg
                        video: []
                        liveLink: https://www.instagram.com/p/CxYz1234abc/
                        boosted: false
                      connectedChannels:
                      - id: b81d5b3c-4a90-4f6a-9c11-71e0dd2fa4a7
                        platform: INSTAGRAM
                        displayName: Jenny Home
                        status: SUCCESS
                        liveLink: https://www.instagram.com/p/CxYz1234abc/
                        error: null
                    pageInfo:
                      total: 64
                      hasNextPage: true
                      totalEngagementPosts: 41
                      totalPublishedPosts: 47
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorObject'
        '401':
          description: Unauthorized — the API key is missing, malformed, or revoked (`SY90005`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':

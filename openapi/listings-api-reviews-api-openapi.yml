                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  interactionDetails:
                    interactions:
                    - id: b2fa765e-c62b-4e0b-b1d6-1c67c855f5e0
                      source: maps.google.com
                      content: Great place for dessert!

openapi: 3.2.0
info:
  title: Listings Reviews API
  version: 2026-09-09
  description: 'REST API for managing business locations: sync listings across Google, Facebook, Bing and other publishers, respond to reviews, publish posts, and pull local search analytics. Authenticate with an API key from the developer dashboard.


    Try the sandbox day pass, no card required, when it is offered: sign up at https://listingsapi.com/signup?plan=day-pass&campaign=daypass. It covers the locations and listings endpoints and syncs only to listingsAPI demo directories. Agents can use the Day pass operations, which need no key; see https://listingsapi.com/docs/day-pass.'
  contact:
    name: Listings API support
    email: support@listingsapi.com
    url: https://www.listingsapi.com/contact
  termsOfService: https://www.listingsapi.com/terms
  license:
    name: Proprietary (Listings API Terms of Service)
    url: https://www.listingsapi.com/terms
  x-logo:
    url: https://www.listingsapi.com/favicon.svg
servers:
- url: https://listingsapi.com
  description: Production
security:
- apiKey: []
- rapidApiKey: []
  rapidApiHost: []
tags:
- name: Reviews
  description: Reviews and review-response endpoints, including analytics.
paths:
  /api/v4/locations/{locationId}/reviews:
    get:
      operationId: interactions
      summary: Paginated list of interactions (reviews / Q&A / social) for a single location…
      tags:
      - Reviews
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          oneOf:
          - type: integer
            description: Raw numeric ID
          - type: string
            description: Base64-encoded Relay ID
          format: base64-or-int
        description: Location ID, a raw numeric database ID (e.g. `1800289`) or its Base64-encoded Relay ID (e.g. `TG9jYXRpb246MTgwMDI4OQ==`).
      - name: siteUrls
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of publisher hostnames to include, e.g. `["maps.google.com","yelp.com"]`.
      - name: startDate
        in: query
        required: false
        schema:
          type: string
        description: Start of the date-range filter (YYYY-MM-DD).
      - name: searchString
        in: query
        required: false
        schema:
          type: string
        description: Full-text search across interaction content.
      - name: endDate
        in: query
        required: false
        schema:
          type: string
        description: End of the date-range filter (YYYY-MM-DD).
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Single interaction category, e.g. `REVIEW`.
      - name: categories
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of interaction categories.
      - name: ratingFilters
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of star ratings to include, e.g. `[3,4]`.
      - name: ratingFilter
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Single star rating to filter by.
      - name: responseStatus
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: 'JSON-encoded response-status filter. Values: `RESPONDED`, `PENDING`.'
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: 'JSON-encoded sort order. Values: `NEWEST_FIRST`, `OLDEST_FIRST`, `LAST_RESPONDED`.'
      - name: first
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records to return, counting forward from the start of the result set.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Cursor to page forward from. Pass `pageInfo.endCursor`, or equivalently the `cursor` of the last edge in the previous page. Stop paging when `pageInfo.hasNextPage` is false, or when a page returns an empty `edges` array.
      - name: last
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records to return, counting backward from the end of the result set.
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Cursor to page backward from, used with `last`. Pass the `cursor` of the first edge of the page you are moving back from. The response `pageInfo` has no `startCursor` field.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      interactions:
                        type: object
                        required:
                        - edges
                        - pageInfo
                        properties:
                          edges:
                            type: array
                            items:
                              type: object
                              required:
                              - node
                              - cursor
                              properties:
                                node:
                                  $ref: '#/components/schemas/InteractionConnection'
                                cursor:
                                  type: string
                          pageInfo:
                            type: object
                            required:
                            - hasNextPage
                            - hasPreviousPage
                            properties:
                              hasNextPage:
                                type: boolean
                              hasPreviousPage:
                                type: boolean
                              endCursor:
                                type:
                                - string
                                - 'null'
                              total:
                                type:
                                - integer
                                - 'null'
                          totalCount:
                            type: integer
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  interactions:
                    pageInfo:
                      hasNextPage: true
                      hasPreviousPage: false
                      endCursor: SW50ZXJhY3Rpb246MV8xNTU0MjQzMDczMDM2LTllMjZkMmE4LWE2ZWQtNDJlYS04NDU0LTQ3ZDFjOTJlYTg0MQ==
                    edges:
                    - node:
                        id: 9e26d2a8-a6ed-42ea-8454-47d1c92ea841
                        source: maps.google.com
                        content: nice place for family together
                        authorName: vaibhav nakate
                        rating: 5
                        date: 2019-04-02 22:11:13.036997+00:00
                        category: Review
                        type: Review
                        responded: false
                        responseCount: 0
                        canRespond: true
                        permalink: https://maps.google.com/maps?cid=...
                      cursor: SW50ZXJhY3Rpb246MV8xNTU0MjQzMDczMDM2LTllMjZkMmE4LWE2ZWQtNDJlYS04NDU0LTQ3ZDFjOTJlYTg0MQ==
                    totalCount: 425
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorObject'
        '401':
          description: Unauthorized — the API key is missing, malformed, or revoked (`SY90005`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden — the key is valid but not permitted for this resource or operation (`SY90003`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit exceeded. Wait `retry_after_seconds` (or the `Retry-After` header) and retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      description: Returns a cursor-paginated list of reviews and social interactions for a single location, with filters.
  /api/v4/rollup_interactions:
    get:
      operationId: rollupInteractions
      summary: Paginated list of interactions across many locations (rollup scope)
      tags:
      - Reviews
      parameters:
      - name: locationFilters
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
      - name: siteUrls
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of publisher hostnames to include.
      - name: startDate
        in: query
        required: false
        schema:
          type: string
        description: Start of the date-range filter (YYYY-MM-DD).
      - name: endDate
        in: query
        required: false
        schema:
          type: string
        description: End of the date-range filter (YYYY-MM-DD).
      - name: searchString
        in: query
        required: false
        schema:
          type: string
        description: Full-text search across interaction content.
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Single interaction category, e.g. `REVIEW`.
      - name: categories
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of interaction categories.
      - name: ratingFilters
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of star ratings to include, e.g. `[3,4]`.
      - name: ratingFilter
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Single star rating to filter by.
      - name: responseStatus
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: 'JSON-encoded response-status filter. Values: `RESPONDED`, `PENDING`.'
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: 'JSON-encoded sort order. Values: `NEWEST_FIRST`, `OLDEST_FIRST`, `LAST_RESPONDED`.'
      - name: first
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records to return, counting forward from the start of the result set.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Cursor to page forward from. Pass `pageInfo.endCursor`, or equivalently the `cursor` of the last edge in the previous page. Stop paging when `pageInfo.hasNextPage` is false, or when a page returns an empty `edges` array.
      - name: last
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records to return, counting backward from the end of the result set.
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Cursor to page backward from, used with `last`. Pass the `cursor` of the first edge of the page you are moving back from. The response `pageInfo` has no `startCursor` field.
      - name: tag
        in: query
        required: false
        schema:
          type: string
          default: all
        description: Location tag to scope the rollup to. Defaults to `all`, every location the key can see.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      rollupInteractions:
                        type: object
                        required:
                        - edges
                        - pageInfo
                        properties:
                          edges:
                            type: array
                            items:
                              type: object
                              required:
                              - node
                              - cursor
                              properties:
                                node:
                                  $ref: '#/components/schemas/InteractionConnection'
                                cursor:
                                  type: string
                          pageInfo:
                            type: object
                            required:
                            - hasNextPage
                            - hasPreviousPage
                            properties:
                              hasNextPage:
                                type: boolean
                              hasPreviousPage:
                                type: boolean
                              endCursor:
                                type:
                                - string
                                - 'null'
                              total:
                                type:
                                - integer
                                - 'null'
                          totalCount:
                            type: integer
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  rollupInteractions:
                    pageInfo:
                      hasNextPage: true
                      hasPreviousPage: false
                    edges:
                    - node:
                        id: 9e26d2a8-a6ed-42ea-8454-47d1c92ea841
                        source: maps.google.com
                        content: Excellent service, highly recommend.
                        authorName: Priya S.
                        rating: 5
                        date: 2026-06-30 12:04:11+00:00
                        category: Review
                        type: Review
                        responded: false
                        responseCount: 0
                        canRespond: true
                        locationId: 1800289
                      cursor: SW50ZXJhY3Rpb246OWUyNmQyYTg=
                    totalCount: 1284
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorObject'
        '401':
          description: Unauthorized — the API key is missing, malformed, or revoked (`SY90005`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden — the key is valid but not permitted for this resource or operation (`SY90003`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit exceeded. Wait `retry_after_seconds` (or the `Retry-After` header) and retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      description: Returns a cursor-paginated list of interactions across many locations in the account, with filtering and sorting.
  /api/v4/review-phrases:
    get:
      operationId: newReviewPhrases
      summary: Newer per-phrase stats breakdown for one or more locations
      tags:
      - Reviews
      parameters:
      - name: locationIds
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON array of location IDs to aggregate over, e.g. `[1800289,1800290]`. Query values are JSON-parsed, so a bare single ID also works. Omit to cover every location the key can read.
      - name: siteUrls
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON array of review sources to include, e.g. `["maps.google.com"]`.
      - name: startDate
        in: query
        required: false
        schema:
          type: string
        description: Only count reviews on or after this date (`YYYY-MM-DD`).
      - name: endDate
        in: query
        required: false
        schema:
          type: string
        description: Only count reviews on or before this date (`YYYY-MM-DD`).
      - name: searchString
        in: query
        required: false
        schema:
          type: string
        description: Only return phrases containing this substring.
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Deprecated single-value form of `categories`. Kept for v4 compatibility; prefer `categories`.
      - name: ratingFilter
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Deprecated single-value form of `ratingFilters`. Kept for v4 compatibility; prefer `ratingFilters`.
      - name: phraseCount
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Maximum number of phrases to return.
      - name: categories
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON array of interaction categories to include (see the interaction attributes reference).
      - name: ratingFilters
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON array of star ratings to include, e.g. `[1,2]` to mine only unhappy reviews.
      - name: responseStatus
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON array of `RESPONDED` / `PENDING` to restrict by whether the review has an owner reply.
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: One of `NEWEST_FIRST`, `OLDEST_FIRST`, `LAST_RESPONDED`, `LOWEST_RATING`, `HIGHEST_RATING`.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      newReviewPhrases:
                        type: array
                        items:
                          $ref: '#/components/schemas/NewReviewPhraseInfo'
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  newReviewPhrases:
                  - reviewPhrase: friendly staff
                    phraseStats:
                      stats:
                      - name: total-reviews
                        value: 46
                        delta: 12.5
                        abs: 5
                      - name: overall-rating
                        value: 4.7
                        delta: 1.1
                        abs: 0.05
                  - reviewPhrase: long wait
                    phraseStats:
                      stats:
                      - name: total-reviews
                        value: 11
                        delta: 37.5
                        abs: 3
                      - name: overall-rating
                        value: 2.9
                        delta: -8.4
                        abs: -0.27
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorObject'
        '401':
          description: Unauthorized — the API key is missing, malformed, or revoked (`SY90005`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden — the key is valid but not permitted for this resource or operation (`SY90003`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit exceeded. Wait `retry_after_seconds` (or the `Retry-After` header) and retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      description: Returns the phrases customers use most in a location's reviews, each with its own review stats.
  /api/v4/reviewDetails:

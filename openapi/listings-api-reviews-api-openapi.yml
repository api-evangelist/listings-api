components:
  schemas:
    ApiErrorResponse:
      type: object
      description: Error response with an `errors` array, returned for most failures. The HTTP status is derived from the error codes, and `data` is present (usually with the operation key set to `null`).
      required:
      - errors
      properties:
        data:
          type:
          - object
          - 'null'
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
    InteractionResponseStatus:
      type: string
      enum:
      - CREATED
      - FAILED
      - COMPLETED
      - CONFIRMED
      description: Lifecycle state of a response item as it's posted out to the source site.
    InteractionsCombinedStats:
      type: object
      properties:
        sitesStats:
          type: array
          items:
            $ref: '#/components/schemas/SiteInteractionCount'
        otherStats:
          type: array
          items:
            $ref: '#/components/schemas/InteractionStat'
    EditResponsePayload:
      type: object
      properties:
        status:
          type: string
        reviewId:
          type: string
        responseId:
          type: string
    SiteInteractionCount:
      type: object
      properties:
        name:
          type: string
        interactionCount:
          type: integer
          format: int32
    RateLimitError:
      type: object
      description: Rate-limit error response. Also carries the `Retry-After` header and the `RateLimit-*` headers.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - RATE_LIMITED
            message:
              type: string
            retry_after_seconds:
              type: integer
              description: Seconds to wait before retrying. Never less than 1.
            limiting_window:
              type: string
              description: Which window was exhausted, e.g. `minute`, `hour`, `day`.
            correlation_id:
              type: string
              description: Request identifier to quote in support requests.
            doc_url:
              type: string
              format: uri
    ApiErrorObject:
      type: object
      description: Error response with a single `error` object, returned when a request is rejected before it runs.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable code, e.g. `INTERNAL_SERVER_ERROR`, `ambiguous_sub_category`, `unknown_sub_category`, or an `SYxxxxx` code.
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Extra context, e.g. the ambiguous query and its candidate categories.
    SiteSetting:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        connected:
          type: boolean
        totalReviews:
          type: integer
          format: int32
        averageRating:
          type: number
          format: float
        lastReviewAt:
          type: string
        monitored:
          type: boolean
        type:
          type: string
        canRespond:
          type: boolean
    InteractionStat:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
          format: float
        delta:
          type: number
          format: float
        abs:
          type: number
          format: float
    Interaction:
      type: object
      description: A single review, Q&A item, or social interaction collected from a source site.
      properties:
        id:
          type: string
        interactionId:
          type: string
        source:
          type: string
        title:
          type: string
        content:
          type: string
        authorName:
          type: string
        rating:
          type: integer
          format: int32
        date:
          type: string
        permalink:
          type: string
        category:
          type: string
        type:
          type: string
        responded:
          type: boolean
        notes:
          type: string
        responses:
          type: array
          items:
            $ref: '#/components/schemas/InteractionResponse'
        responseCount:
          type: integer
          format: int32
        canRespond:
          type: boolean
        locationId:
          type: integer
          format: int32
        flaggedReason:
          type: string
    ContextInfoType:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    InteractionsAnalyticsStats:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: '#/components/schemas/InteractionStat'
    ApiError:
      type: object
      description: 'One entry of the `errors` array. `message` is always present and starts with the `SYxxxxx: reason` code prefix when the failure has an error code.'
      required:
      - message
      properties:
        message:
          type: string
          description: Human-readable reason, prefixed with the `SYxxxxx` code where one applies.
        code:
          type: string
          description: The `SYxxxxx` error code on its own, when one applies.
        contextInfo:
          type: array
          description: Key/value pairs naming the field or value that failed.
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
    ArchiveInteractionPayload:
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorType'
    ErrorType:
      type: object
      properties:
        message:
          type: string
        contextInfo:
          type: array
          items:
            $ref: '#/components/schemas/ContextInfoType'
        code:
          type: string
    NewReviewPhraseInfo:
      type: object
      properties:
        reviewPhrase:
          type: string
        phraseStats:
          $ref: '#/components/schemas/InteractionsStats'
    InteractionSiteConfig:
      type: object
      properties:
        id:
          type: integer
          format: int32
        site:
          type: string
        color:
          type: string
        opacity:
          type: number
          format: float
        siteUrl:
          type: string
        image:
          type: string
        baseUrl:
          type: string
        supportedInPlan:
          type: boolean
    InteractionsDetail:
      type: object
      properties:
        interactions:
          type: array
          items:
            $ref: '#/components/schemas/Interaction'
    InteractionConnection:
      type: object
      description: Relay-style paginated list of interactions with aggregate stats.
      properties:
        pageInfo:
          $ref: '#/components/schemas/ReviewsPageInfo'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/InteractionEdge'
        totalCount:
          type: integer
          format: int32
        interactionStats:
          $ref: '#/components/schemas/InteractionsCombinedStats'
      required:
      - pageInfo
    InteractionsChartData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChartData'
    ChartData:
      type: object
      properties:
        date:
          type: string
          format: date
        interactionCount:
          type: integer
          format: int32
        averageRating:
          type: number
          format: float
    InteractionsSitesStats:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: '#/components/schemas/SiteStat'
    DeltaStat:
      type: object
      properties:
        value:
          type: number
          format: float
        delta:
          type: number
          format: float
    InteractionResponse:
      type: object
      description: A response to an interaction (review reply, Q&A answer).
      properties:
        id:
          type: string
        interactionId:
          type: string
        content:
          type: string
        authorName:
          type: string
        date:
          type: string
        respondedWith:
          type: string
        respondedBy:
          type: integer
          format: int32
        interactionStatus:
          $ref: '#/components/schemas/InteractionResponseStatus'
        editedResponse:
          type: boolean
        remarks:
          type: string
    RespondToInteractionPayload:
      type: object
      properties:
        interaction:
          $ref: '#/components/schemas/InteractionResponse'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorType'
    EditInteractionsSetting:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorType'
        interactionSetting:
          $ref: '#/components/schemas/InteractionsSetting'
    SiteStat:
      type: object
      properties:
        key:
          type: string
        siteUrl:
          type: string
        averageRating:
          $ref: '#/components/schemas/DeltaStat'
        totalInteractions:
          $ref: '#/components/schemas/DeltaStat'
        newInteractions:
          $ref: '#/components/schemas/DeltaStat'
        baseRating:
          type: number
          format: float
        baseInteractions:
          type: integer
          format: int32
        recency:
          type: string
        humanizedRecency:
          type: string
    InteractionsSetting:
      type: object
      properties:
        id:
          type: string
        positiveInteractionThreshold:
          type: integer
          format: int32
        siteSettings:
          type: array
          items:
            $ref: '#/components/schemas/SiteSetting'
        locationId:
          type: string
    InteractionsStats:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: '#/components/schemas/InteractionStat'
    ReviewsPageInfo:
      type: object
      properties:
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
        startCursor:
          type: string
        endCursor:
          type: string
      required:
      - hasNextPage
      - hasPreviousPage
    InteractionEdge:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/Interaction'
        cursor:
          type: string
      required:
      - cursor
    SiteSettingInputType:
      type: object
      description: Input payload representing a single connected site entry on interactions settings.
      properties:
        name:
          type: string
        url:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authenticate with `Authorization: API <your-key>`.'
    rapidApiKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: RapidAPI marketplace key. Sent with `X-RapidAPI-Host` when calling via the RapidAPI proxy.
    rapidApiHost:
      type: apiKey
      in: header
      name: X-RapidAPI-Host
      description: RapidAPI marketplace host header. Sent with `X-RapidAPI-Key` when calling via the RapidAPI proxy.
externalDocs:
  description: Developer documentation
  url: https://listingsapi.com/docs

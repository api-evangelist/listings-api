        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Returns a single bulk (multi-location) post campaign with its content, per-location publish status, and engagement analytics.
  /api/v4/locations/{locationId}/posts:
    get:
      operationId: rollupSocialPostsByLocation
      summary: List of post campaigns for tags/locations
      tags:
      - Posts
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
        description: Base64-encoded location cursor / global ID (e.g. `TG9jYXRpb246MTgwMDI4OQ==`). Pass it verbatim, do not URL-encode it. The base64 cursor always resolves; the raw numeric database ID also works on this endpoint, but the base64 form is the portable choice across the API.
      - name: locationIds
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of location IDs to include alongside the path location.
      - name: filters
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded SocialPostFiltersInput (e.g. by `type`, `status`, `creationDateRange`, `siteUrls`).
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: 1-based page number for offset pagination.
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records per page.
      - name: sortFields
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: 'JSON-encoded sort object `{ "field": "created_at", "order": "Descending" }`. `field` is one of name, type, status, created_at, schedule_start_date, schedule_end_date, client_name, clicks, views, shares.'
      - name: componentIdentifier
        in: query
        required: false
        schema:
          type: string
        description: Filter to posts created by a specific component/integration.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialPostPaginated'
              example:
                data:
                  rollupSocialPosts:
                    records:
                    - id: U29jaWFsUG9zdDo0NDEyMg==
                      name: Summer Hours Update
                      status: SUCCESS
                      type: ANNOUNCEMENT
                      createdAt: 2026-06-28
                      scheduledStartDate: 2026-06-28
                      scheduledEndDate: 2026-07-28
                      views: 128
                      clicks: 14
                      shares: 0
                      reactions: 3
                      comments: 1
                      sites:
                      - GOOGLE
                      message:
                      - site: GOOGLE
                        message: We have extended our summer hours! Open until 9pm on weekdays.
                      cta:
                      - type:
                          value: LEARN_MORE
                          label: Learn more
                        url: https://jennyhome.example/hours
                        site: GOOGLE
                        tinyUrl: https://tiny.cc/jh-hours
                      contextInfo: null
                      mediaUrl:
                      - url: https://cdn.listingsapi.com/posts/44122/summer.jpg
                        site: GOOGLE
                        type: IMAGE
                      publishDetails:
                      - site: GOOGLE
                        status: PUBLISHED
                        createdDate: 2026-06-28
                        publishedDate: 2026-06-28
                        submissionError: null
                      postLinks:
                      - site: GOOGLE
                        link: https://www.google.com/maps/place/?post=44122
                      locationIds:
                      - 1800289
                      clientName: Jenny Home
                    locationDetails:
                    - id: TG9jYXRpb246MTgwMDI4OQ==
                      name: Jenny Home
                      street: 600 Congress Ave, Suite 200
                      city: Austin
                      postalCode: '78701'
                      countryIso: US
                      stateIso: TX
                      stateName: Texas
                      storeId: null
                    pageInfo:
                      totalPages: 1
                      hasNextPage: false
                      hasPreviousPage: false
                      totalRecords: 1
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Returns a page of social post campaigns (announcements, events, offers) that target a single location.

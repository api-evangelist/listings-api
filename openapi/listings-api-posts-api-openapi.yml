                        submissionError: null
                      - site: FACEBOOK
                        status: PUBLISHED
                        createdDate: 2026-06-20
                        publishedDate: 2026-06-22
                        submissionError: null
                      postLinks:
                      - site: GOOGLE
                        link: https://www.google.com/maps/place/?post=51088
                      locationIds:
                      - 1800289
                      - 1800290
                      - 1800291
                    publishedLocationsCount: 3

openapi: 3.2.0
info:
  title: Listings Posts API
  version: 2026-08-27
  description: 'REST API for managing business locations: sync listings across Google, Facebook, Bing and other publishers, respond to reviews, publish posts, and pull local search analytics. Authenticate with an API key from the developer dashboard.'
  contact:
    name: Listings API support
    email: support@listingsapi.com
    url: https://www.listingsapi.com/contact
  termsOfService: https://www.listingsapi.com/terms
  license:
    name: Proprietary (Listings API Terms of Service)
    url: https://www.listingsapi.com/terms
  x-logo:
    url: https://www.listingsapi.com/favicon.svg
servers:
- url: https://listingsapi.com
  description: Production
security:
- apiKey: []
- rapidApiKey: []
  rapidApiHost: []
tags:
- name: Posts
  description: Create and manage Google Business Profile posts — announcements, events, and offers — across locations.
paths:
  /api/v4/posts/{postId}:
    get:
      operationId: socialPostView
      summary: Individual social post view page
      tags:
      - Posts
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
        description: Base64-encoded social post ID (e.g. from the `id` field of a posts list, or the `socialPost.id` returned by POST /posts).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialPostView'
              example:
                data:
                  socialPostView:
                    socialPostId: U29jaWFsUG9zdDo0NDEyMg==
                    socialPostInfo:
                      id: U29jaWFsUG9zdDo0NDEyMg==
                      name: Summer Hours Update
                      status: SUCCESS
                      type: ANNOUNCEMENT
                      createdAt: 2026-06-28
                      scheduledStartDate: 2026-06-28
                      scheduledEndDate: 2026-07-28
                      views: 128
                      clicks: 14
                      shares: 0
                      reactions: 3
                      comments: 1
                      sites:
                      - GOOGLE
                      message:
                      - site: GOOGLE
                        message: We have extended our summer hours! Open until 9pm on weekdays.
                      cta:
                      - type:
                          value: LEARN_MORE
                          label: Learn more
                        url: https://jennyhome.example/hours
                        site: GOOGLE
                        tinyUrl: https://tiny.cc/jh-hours
                      contextInfo: null
                      mediaUrl:
                      - url: https://cdn.listingsapi.com/posts/44122/summer.jpg
                        site: GOOGLE
                        type: IMAGE
                      publishDetails:
                      - site: GOOGLE
                        status: PUBLISHED
                        createdDate: 2026-06-28
                        publishedDate: 2026-06-28
                        submissionError: null
                      postLinks:
                      - site: GOOGLE
                        link: https://www.google.com/maps/place/?post=44122
                      locationIds:
                      - 1800289
                    publishedLocationsCount: 1
                    socialPostAnalyticsBySite:
                    - site: GOOGLE
                      views: 128
                      clicks: 14
                      reactions: 3
                      shares: 0
                      comments: 1
                    socialPostAnalyticsByLocationId:
                    - locationId: 1800289
                      siteStats:
                      - site: GOOGLE
                        status: PUBLISHED
                        views: 128
                        clicks: 14
                        reactions: 3
                        shares: 0
                        comments: 1
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Returns a single social post campaign with its content, per-site publish status, and engagement analytics.
    delete:
      operationId: deleteSocialPost
      summary: Delete a social post
      tags:
      - Posts
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
        description: Base64-encoded social post ID to delete (the `id` from a posts list or the create response).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSocialPostMutation'
              example:
                data:
                  deleteSocialPost:
                    success: true
                    socialPostId: U29jaWFsUG9zdDo0NDEyMg==
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientMutationId:
                  type: string
            example:
              clientMutationId: delete-44122-req-1
      description: Permanently deletes a social post campaign and removes it from every site it was published to.
  /api/v4/posts:
    post:
      operationId: createSocialPost
      summary: Create social posts for multiple locations
      tags:
      - Posts
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialPostMutation'
              example:
                data:
                  createSocialPost:
                    clientMutationId: null
                    success: true
                    errors: []
                    socialPost:
                      id: U29jaWFsUG9zdDo0NDEyMg==
                      name: Grand Opening Announcement
                      status: INPROGRESS
                      type: ANNOUNCEMENT
                      createdAt: 2026-06-28
                      sites:
                      - GOOGLE
                      message:
                      - site: GOOGLE
                        message: We are now open! Visit Jenny Home this week for our grand opening.
                      cta:
                      - type:
                          value: LEARN_MORE
                          label: Learn more
                        url: https://jennyhome.example/opening
                        site: GOOGLE
                        tinyUrl: null
                      contextInfo: null
                      mediaUrl:
                      - url: https://cdn.example.com/opening.jpg
                        site: GOOGLE
                        type: IMAGE
                      publishDetails:
                      - site: GOOGLE
                        status: PUBLISHING
                        createdDate: 2026-06-28
                        submissionError: null
                      postLinks: []
                      locationIds:
                      - 1800289
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  $ref: '#/components/schemas/CreateSocialPostMutationInput'
              required:
              - input
            example:
              input:
                postName: Grand Opening Announcement
                locationIds:
                - TG9jYXRpb246MTgwMDI4OQ==
                postType: ANNOUNCEMENT
                postSites:
                - GOOGLE
                postMessage:
                - site: GOOGLE
                  message: We are now open! Visit Jenny Home this week for our grand opening.
                postCta:
                - site: GOOGLE
                  type: LEARN_MORE
                  url: https://jennyhome.example/opening
                postMediaUrl:
                - site: GOOGLE
                  url: https://cdn.example.com/opening.jpg
                  type: IMAGE
      description: Creates an ANNOUNCEMENT social post and publishes it to the chosen sites for one or more locations.
  /api/v4/bulk-posts:
    post:
      operationId: createBulkSocialPost
      summary: Create social posts for multiple locations
      tags:
      - Posts
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialPostMutation'
              example:
                data:
                  createSocialPost:
                    clientMutationId: null
                    success: true
                    errors: null
                    socialPost:
                      id: U29jaWFsUG9zdDo5OTIwMQ==
                      name: July Reopening Announcement
                      status: SCHEDULED
                      type: ANNOUNCEMENT
                      createdAt: 2026-07-08
                      scheduledStartDate: 2026-07-10
                      scheduledEndDate: 2026-07-24
                      sites:
                      - GOOGLE
                      - FACEBOOK
                      locationIds:
                      - 1800289
                      - 1800290
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  $ref: '#/components/schemas/CreateSocialPostMutationInput'
              required:
              - input
            example:
              input:
                postName: July Reopening Announcement
                locationIds:
                - TG9jYXRpb246MTgwMDI4OQ==
                - TG9jYXRpb246MTgwMDI5MA==
                postType: ANNOUNCEMENT
                postSites:
                - GOOGLE
                - FACEBOOK
                postMessage:
                - site: GOOGLE
                  message: We're back! Visit us this week for our summer menu.
                - site: FACEBOOK
                  message: We're back! Swing by for the new summer menu.
                postMediaUrl:
                - site: GOOGLE
                  url: https://cdn.example.com/summer.jpg
                  type: IMAGE
                postScheduledDates:
                  startDatetime: 2026-07-10 09:00:00+00:00
                  endDatetime: 2026-07-24 23:59:00+00:00
      description: Creates one social post and publishes it across many locations in a single request.
  /api/v4/bulk-posts/{postId}:
    get:
      operationId: socialPostViewBulk
      summary: Individual social post view page
      tags:
      - Posts
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
        description: Base64-encoded bulk post ID (the `id` returned by POST /bulk-posts or listed by GET /locations/{locationId}/bulk-posts).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialPostView'

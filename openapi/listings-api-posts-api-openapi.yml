components:
  schemas:
    SocialPostPublishedLink:
      type: object
      properties:
        site:
          $ref: '#/components/schemas/SitesType'
        link:
          type: string
    CreateSocialPostMutationInput:
      type: object
      properties:
        postName:
          type: string
        locationIds:
          type: array
          items:
            type: string
        postType:
          $ref: '#/components/schemas/SocialPostTypeEnum'
        postSites:
          type: array
          items:
            $ref: '#/components/schemas/SitesType'
        postMessage:
          type: array
          items:
            $ref: '#/components/schemas/PostMessageInput'
        postCta:
          type: array
          items:
            $ref: '#/components/schemas/PostCtaInput'
        postMediaUrl:
          type: array
          items:
            $ref: '#/components/schemas/SocialPostMediaInput'
        postScheduledDates:
          $ref: '#/components/schemas/PostScheduledDatesInput'
        postContextInfo:
          $ref: '#/components/schemas/PostContextInfoInput'
        componentIdentifier:
          type: string
        componentType:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductInfoInput'
        clientMutationId:
          type: string
      required:
      - postName
      - locationIds
      - postType
      - postSites
    ContextError:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    PublishStatusEnum:
      type: string
      enum:
      - PUBLISHING
      - PUBLISHED
      - DELETED
      - EXPIRED
      - ERROR
      description: Publish statuses per site.
    PostScheduledDatesInput:
      type: object
      properties:
        startDatetime:
          type: string
          description: Custom scalar Datetime
        endDatetime:
          type: string
          description: Custom scalar Datetime
        removalSites:
          type: array
          items:
            $ref: '#/components/schemas/SitesType'
      required:
      - startDatetime
      - endDatetime
    SiteCtaTypes:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
    StatsAndStatus:
      type: object
      properties:
        clicks:
          type: integer
          format: int32
        views:
          type: integer
          format: int32
        reactions:
          type: integer
          format: int32
        shares:
          type: integer
          format: int32
        comments:
          type: integer
          format: int32
        status:
          type: string
        site:
          $ref: '#/components/schemas/SitesType'
    SocialPostPaginated:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SocialPostEs'
        locationDetails:
          type: array
          items:
            $ref: '#/components/schemas/LocationDetails'
        pageInfo:
          $ref: '#/components/schemas/OffsetBasedPageInfo'
      required:
      - pageInfo
    PostContextInfo:
      type: object
      properties:
        couponCode:
          type: string
        redeemUrl:
          type: string

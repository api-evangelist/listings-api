                      scheduledStartDate: 2026-06-22
                      scheduledEndDate: 2026-07-06
                      views: 4210
                      clicks: 318
                      shares: 12
                      reactions: 87
                      comments: 4
                      sites:
                      - GOOGLE
                      - FACEBOOK
                      message:
                      - site: GOOGLE
                        message: Festive savings across all our stores this week.
                      - site: FACEBOOK
                        message: Festive savings across all our stores this week!
                      cta:
                      - type:

                    - startTime: 2025-06-01 00:00:00+00:00
                      value: 8
                    websiteAction:
                    - startTime: 2025-06-01 00:00:00+00:00
                      value: 41
                    businessBookings:
                    - startTime: 2025-06-01 00:00:00+00:00
                      value: 0
                    businessFoodOrders:
                    - startTime: 2025-06-01 00:00:00+00:00

openapi: 3.2.0
info:
  title: Listings Locations API
  version: 2026-09-09
  description: 'REST API for managing business locations: sync listings across Google, Facebook, Bing and other publishers, respond to reviews, publish posts, and pull local search analytics. Authenticate with an API key from the developer dashboard.


    Try the sandbox day pass, no card required, when it is offered: sign up at https://listingsapi.com/signup?plan=day-pass&campaign=daypass. It covers the locations and listings endpoints and syncs only to listingsAPI demo directories. Agents can use the Day pass operations, which need no key; see https://listingsapi.com/docs/day-pass.'
  contact:
    name: Listings API support
    email: support@listingsapi.com
    url: https://www.listingsapi.com/contact
  termsOfService: https://www.listingsapi.com/terms
  license:
    name: Proprietary (Listings API Terms of Service)
    url: https://www.listingsapi.com/terms
  x-logo:
    url: https://www.listingsapi.com/favicon.svg
servers:
- url: https://listingsapi.com
  description: Production
security:
- apiKey: []
- rapidApiKey: []
  rapidApiHost: []
tags:
- name: Locations
  description: Create, update, archive, and inspect business locations.
paths:
  /api/v4/locations-by-store-codes:
    get:
      operationId: getLocationsByStoreCodes
      summary: Get locations by the Store Codes
      tags:
      - Locations
      parameters:
      - name: storeCodes
        in: query
        required: true
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of store code strings, e.g. `["ACME01","jio678"]`. URL-encode the value.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      getLocationsByStoreCodes:
                        type: array
                        items:
                          $ref: '#/components/schemas/LocationSummaryType'
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  getLocationsByStoreCodes:
                  - id: TG9jYXRpb246MTgwMDI4OQ==
                    databaseId: 1800289
                    accountId: 62670
                    storeId: ACME01
                    name: Jenny Home
                    archived: false
                    street: 600 Congress Ave, Suite 200
                    city: Austin
                    stateIso: TX
                    postalCode: '78701'
                    countryIso: US
                    phone: '5125550142'
                    categoryId: 15
                    subCategoryId: 1432
                    subCategoryName: Restaurants
                    package: PREMIUM
                    planId: 3797
                    planName: Launch
                    placeActionLinks:
                    - placeActionType: FOOD_ORDERING
                      uri: https://order.example.com
                      isPreferred: true
                      name: locations/1944.../placeActionLinks/54ada85bc246058a
                      submissionStatus: success
                    discoveredPlaceActionLinks: []
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorObject'
        '401':
          description: Unauthorized — the API key is missing, malformed, or revoked (`SY90005`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden — the key is valid but not permitted for this resource or operation (`SY90003`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit exceeded. Wait `retry_after_seconds` (or the `Retry-After` header) and retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      description: Returns full location details for one or more locations identified by their store codes.
  /api/v4/locations:
    get:
      operationId: allLocations
      summary: All locations that belong to an account
      tags:
      - Locations
      parameters:
      - name: first
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records to return, counting forward from the start of the result set.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Cursor to page forward from. Pass `pageInfo.endCursor`, or equivalently the `cursor` of the last edge in the previous page. Stop paging when `pageInfo.hasNextPage` is false, or when a page returns an empty `edges` array.
      - name: last
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records to return, counting backward from the end of the result set.
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Cursor to page backward from, used with `last`. Pass the `cursor` of the first edge of the page you are moving back from. The response `pageInfo` has no `startCursor` field.
      - name: filter
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded filter object to narrow the result set (e.g. by approval status or sync state).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      allLocations:
                        type: object
                        required:
                        - edges
                        - pageInfo
                        properties:
                          edges:
                            type: array
                            items:
                              type: object
                              required:
                              - node
                              - cursor
                              properties:
                                node:
                                  $ref: '#/components/schemas/LocationSummaryConnectionType'
                                cursor:
                                  type: string
                          pageInfo:
                            type: object
                            required:
                            - hasNextPage
                            - hasPreviousPage
                            properties:
                              hasNextPage:
                                type: boolean
                              hasPreviousPage:
                                type: boolean
                              endCursor:
                                type:
                                - string
                                - 'null'
                              total:
                                type:
                                - integer
                                - 'null'
                          totalCount:
                            type: integer
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  allLocations:
                    edges:
                    - cursor: TG9jYXRpb246MTgwMDI4OQ==
                      node:
                        id: TG9jYXRpb246MTgwMDI4OQ==
                        databaseId: 1800289
                        accountId: 62670
                        accountName: owner@brightsmile-dental.com
                        name: Jenny Home
                        approved: APPROVED
                        archived: false
                        archivalScheduledAt: null
                        archivedAt: null
                        street: 600 Congress Ave, Suite 200
                        city: Austin
                        stateIso: TX
                        stateName: Texas
                        postalCode: '78701'
                        countryIso: US
                        countryCode: '1'
                        latitude: '30.2711286'
                        longitude: '-97.7436995'
                        phone: '5125550142'
                        additionalPhones: []
                        bizUrl: null
                        hideAddress: false
                        storeId: null
                        categoryId: 15
                        subCategoryId: 1432
                        subCategoryName: Restaurants
                        additionalCategoryIds: []
                        additionalCategoryNames: []
                        description: This is a standalone duplex house. A comfortable, private residence located in the Bouldin Creek neighborhood of Austin, offering spacious duplex living with easy access to the surrounding South Congress area and downtown Austin.
                        businessHours: []
                        package: PREMIUM
                        planId: 3797
                        planName: Launch
                        temporarilyClosed: false
                        ownerEmail: null
                        ownerName: null
                        googleVerificationStatus:
                          status: NOT_CONNECTED

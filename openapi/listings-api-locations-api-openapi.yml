                      primaryGbpSiteCategoryId: null
                      placeActionLinks:
                      - placeActionType: APPOINTMENT
                        uri: https://book.acmedental.example.com
                        isPreferred: true
                        name: null
                        submissionStatus: null
                      - placeActionType: ONLINE_APPOINTMENT
                        uri: https://virtual.acmedental.example.com
                        isPreferred: false
                        name: null
                        submissionStatus: null
                      discoveredPlaceActionLinks: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  $ref: '#/components/schemas/CreateLocationInput'
              required:
              - input
            example:
              input:
                name: Acme Dental
                description: Acme Dental is a family-owned dental practice in downtown New York offering preventive care, cosmetic dentistry, orthodontics, and emergency appointments. Our board-certified team combines modern equipment with a gentle, patient-first approach, and same-week appointments are available for new patients.
                storeId: ACME01

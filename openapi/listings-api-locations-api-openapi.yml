                data:
                  starLocationPhotos:
                    clientMutationId: null
                    photos:
                    - id: TWVkaWFGaWxlOjU4Nzg5MzI=
                      url: https://sy-media-store.s3-us-west-2.amazonaws.com/f868bb3f/59c670a3/ef4ffb12.jpg
                      caption: null
                      starred: true
                    errors: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  $ref: '#/components/schemas/StarLocationPhotosInput'
              required:
              - input
            example:
              input:
                locationId: TG9jYXRpb246MTgwMDI4OQ==
                photoIds:
                - TWVkaWFGaWxlOjU4Nzg5MzI=
                starred: true
      description: Marks one or more of a location's additional photos as favourites for priority placement on supported publishers.
  /api/v4/locations/archive:
    post:
      operationId: archiveLocations
      summary: Archive locations
      tags:
      - Locations
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveLocationsPayload'
              example:
                data:
                  archiveLocations:
                    clientMutationId: null
                    bulkEditTaskId: null
                    errors: null
                    success: null
                    result:
                    - locationId: TG9jYXRpb246MTgwMDI4OQ==
                      status: ARCHIVE_SCHEDULED
                      success: true
                      errors: null
                    - locationId: TG9jYXRpb246MTgwMDI5MA==
                      status: ARCHIVE_SCHEDULED
                      success: true
                      errors: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  $ref: '#/components/schemas/ArchiveLocationsInput'
              required:
              - input
            example:
              input:
                locationIds:
                - TG9jYXRpb246MTgwMDI4OQ==
                - TG9jYXRpb246MTgwMDI5MA==
      description: Schedules one or more locations for archival at the end of the current billing cycle.
  /api/v4/locations/cancel_archive:
    post:
      operationId: cancelLocationsArchive
      summary: Cancel archival of locations
      tags:
      - Locations
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelLocationsArchivePayload'
              example:
                data:
                  cancelLocationsArchive:
                    clientMutationId: null
                    bulkEditTaskId: null
                    errors: null
                    success: null
                    result:
                    - locationId: TG9jYXRpb246MTgwMDI4OQ==
                      status: ACTIVE
                      success: true
                      errors: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  $ref: '#/components/schemas/CancelLocationsArchiveInput'
              required:
              - input
            example:
              input:
                locationIds:
                - TG9jYXRpb246MTgwMDI4OQ==
      description: Cancels a pending archival for locations in ARCHIVE_SCHEDULED status, restoring them to active.
  /api/v4/locations/{locationId}/photos:
    get:
      operationId: mediaFilesOfLocation
      summary: List media files attached to a single location (starred + unstarred)
      tags:
      - Locations
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          oneOf:
          - type: integer
            description: Raw numeric ID
          - type: string
            description: Base64-encoded Relay ID
          format: base64-or-int
        description: 'The location''s raw Base64-encoded Relay ID (for example `TG9jYXRpb246MTgwMDI4OQ==`). Send it un-encoded, a numeric database ID or a URL-encoded value returns `SY90002: Invalid Id`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaFileOfLocationType'
              example:
                data:
                  mediaFilesOfLocation:
                  - id: TWVkaWFGaWxlOjU4Nzg5MzE=
                    url: https://sy-media-store.s3-us-west-2.amazonaws.com/f868bb3f/59c670a3/f47d62a6.jpg
                    thumbnailUrl: https://sy-media-store.s3-us-west-2.amazonaws.com/f868bb3f/59c670a3/thumbnail_f47d62a6.jpg
                    categoryName: Logo
                    categoryId: '4'
                    fileType: image
                    starred: false
                    viewsCount: 0
                  - id: TWVkaWFGaWxlOjU4Nzg5MzI=
                    url: https://sy-media-store.s3-us-west-2.amazonaws.com/f868bb3f/59c670a3/ef4ffb12.jpg
                    thumbnailUrl: https://sy-media-store.s3-us-west-2.amazonaws.com/f868bb3f/59c670a3/thumbnail_ef4ffb12.jpg
                    categoryName: Additional
                    categoryId: '12'
                    fileType: image
                    starred: true
                    viewsCount: 143
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Returns all media files attached to a single location, including starred and unstarred photos.
  /api/v4/locations/photos/requests/{requestId}:
    get:
      operationId: getLocationPhotosUploadStatus
      summary: Return the status of a bulk add-media-to-location request
      tags:
      - Locations
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
        description: UUID request ID returned in the `request` object by the add-photos endpoint when a batch exceeds 30 photos.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPhotosUploadStatusType'
              example:
                data:
                  getLocationPhotosUploadStatus:
                    requestId: e6c2d9d9-9a18-4015-88cf-9a4e19a6f49a
                    status: SUCCESS
                    photos:
                    - mediaId: TWVkaWFGaWxlOjkxODI3
                      locationId: TG9jYXRpb246MTgwMDI4OQ==
                      status: SUCCESS
                      errorMessage: null
                    - mediaId: null
                      locationId: TG9jYXRpb246MTgwMDI4OQ==
                      status: ERROR
                      errorMessage: Image dimensions below the minimum 250x250.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Returns the current processing status for a bulk photo upload request.
components:
  schemas:
    DayOfTheWeekType:
      type: string

openapi: 3.2.0
info:
  title: Listings Locations API
  version: 2026-08-27
  description: 'REST API for managing business locations: sync listings across Google, Facebook, Bing and other publishers, respond to reviews, publish posts, and pull local search analytics. Authenticate with an API key from the developer dashboard.'
  contact:
    name: Listings API support
    email: support@listingsapi.com
    url: https://www.listingsapi.com/contact
  termsOfService: https://www.listingsapi.com/terms
  license:
    name: Proprietary (Listings API Terms of Service)
    url: https://www.listingsapi.com/terms
  x-logo:
    url: https://www.listingsapi.com/favicon.svg
servers:
- url: https://listingsapi.com
  description: Production
security:
- apiKey: []
- rapidApiKey: []
  rapidApiHost: []
tags:
- name: Locations
  description: Create, update, archive, and inspect business locations.
paths:
  /api/v4/locations-by-store-codes:
    get:
      operationId: getLocationsByStoreCodes
      summary: Get locations by the Store Codes
      tags:
      - Locations
      parameters:
      - name: storeCodes
        in: query
        required: true
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded array of store code strings, e.g. `["ACME01","jio678"]`. URL-encode the value.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationSummaryType'
              example:
                data:
                  getLocationsByStoreCodes:
                  - id: TG9jYXRpb246MTgwMDI4OQ==
                    databaseId: 1800289
                    accountId: 62670
                    storeId: ACME01
                    name: Jenny Home
                    archived: false
                    street: 600 Congress Ave, Suite 200
                    city: Austin
                    stateIso: TX
                    postalCode: '78701'
                    countryIso: US
                    phone: '5125550142'
                    categoryId: 15
                    subCategoryId: 1432
                    subCategoryName: Restaurants
                    package: PREMIUM
                    planId: 3797
                    planName: Launch
                    placeActionLinks:
                    - placeActionType: FOOD_ORDERING
                      uri: https://order.example.com
                      isPreferred: true
                      name: locations/1944.../placeActionLinks/54ada85bc246058a
                      submissionStatus: success
                    discoveredPlaceActionLinks: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Returns full location details for one or more locations identified by their store codes.
  /api/v4/locations:
    get:
      operationId: allLocations
      summary: All locations that belong to an account
      tags:
      - Locations
      parameters:
      - name: first
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records to return, counting forward from the start of the result set.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Cursor to page forward from. Pass `pageInfo.endCursor`, or equivalently the `cursor` of the last edge in the previous page. Stop paging when `pageInfo.hasNextPage` is false, or when a page returns an empty `edges` array.
      - name: last
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of records to return, counting backward from the end of the result set.
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Cursor to page backward from, used with `last`. Pass the `cursor` of the first edge of the page you are moving back from — the gateway's shared `PageInfo` type exposes no `startCursor` field.
      - name: filter
        in: query
        required: false
        schema:
          type: string
          description: JSON-encoded filter object
        description: JSON-encoded filter object to narrow the result set (e.g. by approval status or sync state).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - edges
                - pageInfo
                properties:
                  edges:
                    type: array
                    items:
                      type: object
                      required:
                      - node
                      - cursor
                      properties:
                        node:
                          $ref: '#/components/schemas/LocationSummaryConnectionType'
                        cursor:
                          type: string
                  pageInfo:
                    type: object
                    required:
                    - hasNextPage
                    - hasPreviousPage
                    properties:
                      hasNextPage:
                        type: boolean
                      hasPreviousPage:
                        type: boolean
                      endCursor:
                        type:
                        - string
                        - 'null'
                      total:
                        type:
                        - integer
                        - 'null'
                  totalCount:
                    type: integer
              example:
                data:
                  allLocations:
                    edges:
                    - cursor: TG9jYXRpb246MTgwMDI4OQ==
                      node:
                        id: TG9jYXRpb246MTgwMDI4OQ==
                        databaseId: 1800289
                        accountId: 62670
                        accountName: owner@brightsmile-dental.com
                        name: Jenny Home
                        approved: APPROVED
                        archived: false
                        archivalScheduledAt: null
                        archivedAt: null
                        street: 600 Congress Ave, Suite 200
                        city: Austin
                        stateIso: TX
                        stateName: Texas
                        postalCode: '78701'
                        countryIso: US
                        countryCode: '1'
                        latitude: '30.2711286'
                        longitude: '-97.7436995'
                        phone: '5125550142'
                        additionalPhones: []
                        bizUrl: null
                        hideAddress: false
                        storeId: null
                        categoryId: 15
                        subCategoryId: 1432
                        subCategoryName: Restaurants
                        additionalCategoryIds: []
                        additionalCategoryNames: []
                        description: This is a standalone duplex house. A comfortable, private residence located in the Bouldin Creek neighborhood of Austin, offering spacious duplex living with easy access to the surrounding South Congress area and downtown Austin.
                        businessHours: []
                        package: PREMIUM
                        planId: 3797
                        planName: Launch
                        temporarilyClosed: false
                        ownerEmail: null
                        ownerName: null
                        googleVerificationStatus:
                          status: NOT_CONNECTED
                          message: null
                        voiceStatus: 3
                        uid: 3c92283c-6145-4a43-8a62-0c15fd712021
                        createdDate: July 06, 2026
                        lastUpdatedDate: July 06, 2026
                        updatedAt: 2026-07-06 18:33:29.664000+00:00
                        placeActionLinks:
                        - placeActionType: FOOD_ORDERING
                          uri: https://order.example.com
                          isPreferred: true
                          name: locations/1944.../placeActionLinks/54ada85bc246058a
                          submissionStatus: success
                          submissionMessage: Already up to date on Google.
                          lastSubmittedAt: 2026-07-08 12:14:36+00:00
                        discoveredPlaceActionLinks:
                        - placeActionType: APPOINTMENT
                          uri: https://book.example.com
                          isPreferred: false
                          name: locations/1944.../placeActionLinks/abc123
                          providerType: MERCHANT
                          isEditable: true
                    pageInfo:
                      hasNextPage: false
                      hasPreviousPage: false
                      endCursor: TG9jYXRpb246MTgwMDI4OQ==
                      total: 1
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Returns a cursor-paginated list of locations in your account.
    post:
      operationId: createLocation
      summary: Create a new location
      tags:
      - Locations
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLocationPayload'
              example:
                data:
                  createLocation:
                    clientMutationId: null
                    success: true
                    errors: null
                    location:
                      id: TG9jYXRpb246MTgwMDI5MA==
                      databaseId: 1800290
                      storeId: ACME01
                      name: Acme Dental
                      street: 123 Jump Street
                      city: New York
                      stateIso: NY
                      postalCode: '10013'
                      countryIso: US
                      phone: '6443859313'

      type: object
      description: A Relay connection over LocationSummary.
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummaryEdgeType'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummaryType'

openapi: 3.2.0
info:
  title: Listings Connected Accounts API
  version: 2026-09-09
  description: 'REST API for managing business locations: sync listings across Google, Facebook, Bing and other publishers, respond to reviews, publish posts, and pull local search analytics. Authenticate with an API key from the developer dashboard.


    Try the sandbox day pass, no card required, when it is offered: sign up at https://listingsapi.com/signup?plan=day-pass&campaign=daypass. It covers the locations and listings endpoints and syncs only to listingsAPI demo directories. Agents can use the Day pass operations, which need no key; see https://listingsapi.com/docs/day-pass.'
  contact:
    name: Listings API support
    email: support@listingsapi.com
    url: https://www.listingsapi.com/contact
  termsOfService: https://www.listingsapi.com/terms
  license:
    name: Proprietary (Listings API Terms of Service)
    url: https://www.listingsapi.com/terms
  x-logo:
    url: https://www.listingsapi.com/favicon.svg
servers:
- url: https://listingsapi.com
  description: Production
security:
- apiKey: []
- rapidApiKey: []
  rapidApiHost: []
tags:
- name: Connected Accounts
  description: Bulk Google / Facebook / Yelp / TripAdvisor account connection flows.
paths:
  /api/v4/connected-accounts:
    get:
      operationId: connectedAccountsInfo
      summary: Lists all connected account info under users account
      tags:
      - Connected Accounts
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
        description: 1-based page number. Defaults to 1.
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
        description: Records per page. Defaults to 20.
      - name: publisher
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ConnectedAccountTypeEnum'
        description: Filter by connected-account type.
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ConnectedAccountsInfoStatusEnum'
        description: Filter by connection status.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      connectedAccountsInfo:
                        $ref: '#/components/schemas/ConnectedAccountsPaginated'
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.
                    items:
                      $ref: '#/components/schemas/ApiError'
              example:
                data:
                  connectedAccountsInfo:
                    pageInfo:
                      hasNextPage: false
                      hasPreviousPage: false
                      totalPages: 1
                      totalRecords: 1
                    records:
                    - accountId: '62670'
                      clientName: owner@brightsmile-dental.com
                      connectedAccountId: 4f712c17-4f95-42dd-90f4-97171a2e67b5
                      connectedAccountType: GoogleAccount
                      connectedLocationsCount: 0
                      connectivityIssue: null
                      email: owner@brightsmile-dental.com
                      lastFetchMatchesRequestedAt: 2026-07-06 21:43:07 UTC
                      remarks: null
                      requestMatches: false
                      requestMatchesStatus: MATCH_COMPLETED
                      status: CONNECTED
        '400':
          description: 'Bad request: a malformed filter, an invalid enum value, or a malformed ID. The body carries an `errors` array, or a single `error` object when the request was rejected before it ran (e.g. `SY90001` on `reviewDetails` with no `interactionIds`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorObject'
        '401':
          description: Unauthorized — the API key is missing, malformed, or revoked (`SY90005`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden — the key is valid but not permitted for this resource or operation (`SY90003`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit exceeded. Wait `retry_after_seconds` (or the `Retry-After` header) and retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Server error. The body carries a single `error` object with code `INTERNAL_SERVER_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorObject'
      description: Returns the Google and Facebook accounts connected to your Listings API account, with connection health and linked-location counts.
  /api/v4/connected-accounts/{connectedAccountId}/details:
    get:
      operationId: connectedAccountDetails
      summary: Details of a connected account
      tags:
      - Connected Accounts
      parameters:
      - name: connectedAccountId
        in: path
        required: true
        schema:
          type: string
        description: UUID of the connected account (from the list connected accounts endpoint).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      connectedAccountDetails:
                        $ref: '#/components/schemas/ConnectedAccountDetails'
                  errors:
                    type: array
                    description: Present when the operation reported a request-level failure. Writes can also report validation nested under `data.<field>.errors` on a 200.

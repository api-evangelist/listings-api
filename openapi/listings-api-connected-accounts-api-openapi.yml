      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - connectedAccountId
              properties:
                connectedAccountId:
                  type: string
                  description: 'Connected-account UUID, from `connectedAccountId` on a `GET /api/v4/connected-accounts` record. Required: omitting it returns listings for a different account.'
                page:
                  type: integer
                  format: int32
                  default: 1
                  description: 1-based page number. Defaults to 1.
                perPage:
                  type: integer
                  format: int32
                  default: 500
                  description: Records per page. Defaults to 500.
                locationInfo:
                  type: string
                  description: Free-text search over the listing's name, address, or phone.
            example:
              connectedAccountId: 4f712c17-4f95-42dd-90f4-97171a2e67b5
              perPage: 50
      description: Returns the Google Business Profile or Facebook listings accessible to a connected account, with optional filtering and pagination.

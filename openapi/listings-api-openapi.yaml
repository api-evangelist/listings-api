    get:
      operationId: rollupSocialPostsByLocation
      summary: List of post campaigns for tags/locations.
      tags:
        - Posts
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
          description: Base64-encoded location cursor / global ID (e.g.
            `TG9jYXRpb246MTgwMDI4OQ==`). Pass it verbatim, do not URL-encode it.
            The base64 cursor always resolves; the raw numeric database ID also
            works on this endpoint, but the base64 form is the portable choice
            across the API.
        - name: locationIds
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded filter object
          description: JSON-encoded array of location IDs to include alongside the path
            location.
        - name: filters
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded filter object
          description: JSON-encoded SocialPostFiltersInput (e.g. by `type`, `status`,
            `creationDateRange`, `siteUrls`).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: 1-based page number for offset pagination.
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: Number of records per page.
        - name: sortFields
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded filter object
          description: 'JSON-encoded sort object `{ "field": "created_at", "order":
            "Descending" }`. `field` is one of name, type, status, created_at,
            schedule_start_date, schedule_end_date, client_name, clicks, views,
            shares.'
        - name: componentIdentifier
          in: query
          required: false
          schema:
            type: string
          description: Filter to posts created by a specific component/integration.
      responses:

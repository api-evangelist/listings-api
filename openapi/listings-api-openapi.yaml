  /api/v4/locations/{locationId}/reviews:
    get:
      operationId: interactions
      summary: Paginated list of interactions (reviews / Q&A / social) for a single
        location, with filters.
      tags:
        - Reviews
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            oneOf:
              - type: integer
                description: Raw numeric ID
              - type: string
                description: Base64-encoded Relay ID
            format: base64-or-int
          description: Location ID, a raw numeric database ID (e.g. `1800289`) or its
            Base64-encoded Relay ID (e.g. `TG9jYXRpb246MTgwMDI4OQ==`).
        - name: siteUrls
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded filter object
          description: JSON-encoded array of publisher hostnames to include, e.g.
            `["maps.google.com","yelp.com"]`.
        - name: startDate
          in: query
          required: false
          schema:
            type: string
          description: Start of the date-range filter (YYYY-MM-DD).
        - name: searchString
          in: query
          required: false
          schema:
            type: string
          description: Full-text search across interaction content.
        - name: endDate
          in: query
          required: false
          schema:
            type: string
          description: End of the date-range filter (YYYY-MM-DD).
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Single interaction category, e.g. `REVIEW`.
        - name: categories
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded filter object
          description: JSON-encoded array of interaction categories.
        - name: ratingFilters
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded filter object
          description: JSON-encoded array of star ratings to include, e.g. `[3,4]`.
        - name: ratingFilter
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: Single star rating to filter by.
        - name: responseStatus
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded filter object
          description: "JSON-encoded response-status filter. Values: `RESPONDED`,
            `PENDING`."
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            description: JSON-encoded filter object
          description: "JSON-encoded sort order. Values: `NEWEST_FIRST`, `OLDEST_FIRST`,
            `LAST_RESPONDED`."
        - name: first
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: Number of records to return, counting forward from the start of the
            result set.
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Cursor to page forward from. Pass `pageInfo.endCursor`, or
            equivalently the `cursor` of the last edge in the previous page.
            Stop paging when `pageInfo.hasNextPage` is false, or when a page
            returns an empty `edges` array.
        - name: last
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: Number of records to return, counting backward from the end of the
            result set.
        - name: before
          in: query
          required: false
          schema:
            type: string
          description: Cursor to page backward from, used with `last`. Pass the `cursor`
            of the first edge of the page you are moving back from — the
            gateway's shared `PageInfo` type exposes no `startCursor` field.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - edges
                  - pageInfo
                properties:
                  edges:
                    type: array
                    items:
                      type: object
                      required:
                        - node
                        - cursor
                      properties:
                        node:
                          $ref: "#/components/schemas/InteractionConnection"
                        cursor:
                          type: string
                  pageInfo:
                    type: object
                    required:
                      - hasNextPage
                      - hasPreviousPage
                    properties:
                      hasNextPage:
                        type: boolean
                      hasPreviousPage:
                        type: boolean
                      endCursor:
                        type:
                          - string
                          - "null"
                      total:
                        type:
                          - integer
                          - "null"
                  totalCount:
                    type: integer
              example:
                data:
                  interactions:
                    pageInfo:
                      hasNextPage: true
                      hasPreviousPage: false
                      endCursor: SW50ZXJhY3Rpb246MV8xNTU0MjQzMDczMDM2LTllMjZkMmE4LWE2ZWQtNDJlYS04NDU0LTQ3ZDFjOTJlYTg0MQ==
                    edges:
                      - node:
                          id: 9e26d2a8-a6ed-42ea-8454-47d1c92ea841
                          source: maps.google.com
                          content: nice place for family together
                          authorName: vaibhav nakate
                          rating: 5
                          date: 2019-04-02T22:11:13.036997+00:00
                          category: Review
                          type: Review
                          responded: false
                          responseCount: 0
                          canRespond: true
                          permalink: https://maps.google.com/maps?cid=...
                        cursor: SW50ZXJhY3Rpb246MV8xNTU0MjQzMDczMDM2LTllMjZkMmE4LWE2ZWQtNDJlYS04NDU0LTQ3ZDFjOTJlYTg0MQ==
                    totalCount: 425
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: Returns a cursor-paginated list of reviews and social interactions
        for a single location, with filters.

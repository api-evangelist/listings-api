                  - placeActionType: APPOINTMENT
                    uri: https://book.acmedental.example.com
                    isPreferred: true
                  - placeActionType: ONLINE_APPOINTMENT
                    uri: https://virtual.acmedental.example.com
      description: Creates a new business location in your account and queues it for
        listing submission.
  /api/v4/locations/search:

              example:
                data:
                  archiveReviewResponse:
                    status: "true"
                    errors: null
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                responseId:
                  type: string
              required:
                - responseId
            example:
              responseId: 2090753a-ece6-4837-8336-8494ad308523
      description: Archives an existing owner response, removing it from the active
        responses tracked for an interaction.

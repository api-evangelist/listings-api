  note: >-
    Objects carry a base64 relay global id (e.g. "TG9jYXRpb246MTgwMDI4OQ==" decodes to
    "Location:1800289") plus a numeric databaseId. Webhook payloads use numeric-string
    location_id. Non-base64 IDs fail with SY90002 Invalid Id.
entities:
  - name: Account
    note: The billing/plan boundary; rate limits and webhooks are per-account. agency_account_id links a managed account to its parent agency.
  - name: Location
    note: The master record everything keys off - profile fields, categories, photos, store code.
  - name: Listing
    note: One record per publisher citation carrying syncStatus, displayStatus, actionRequired, syncIssue, listingUrl; premium and duplicate variants.
  - name: ConnectedAccount
    note: A linked Google or Facebook account, with listings, folders, and connection suggestions.
  - name: Review (Interaction)
    note: A review pulled from a publisher, with rating, author, text, date, source site, and canRespond.
  - name: ReviewResponse
    note: A public owner reply, editable and archivable.
  - name: Post (SocialPost)
    note: An announcement, event, or offer published to Google Business Profile / Facebook; bulk posts fan one post across locations.
  - name: Photo (MediaFile)
    note: Media attached to a location; uploads are asynchronous (upload-status endpoint).
  - name: AnalyticsSnapshot
    note: Per-publisher performance (Google/Facebook/Bing) per location and date range.

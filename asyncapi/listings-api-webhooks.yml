type: webhooks
model: >-
  One webhooks URL per account, no per-event subscription: every event is delivered to that one
  URL; consumers branch on the "event" field. Five delivery gates must all pass before a request
  is sent: plan includes webhooks, a URL is saved, the endpoint passed verification (skipped if
  no signing secret was ever generated), the URL resolves to a public address, and the account
  is inside its plan's webhook limit.
envelope:
  fields:
    event: dotted event name (branch on this)
    timestamp: ISO-8601 UTC, stamped when the delivery was built
    account_id: integer
    location_id: numeric string ("279381", not 279381; not coerced on interaction.* events)
    data: event-specific object; optional fields are OMITTED when empty, never null
    agency_account_id: integer, only when the account is managed by a parent agency account
  exception: listing.submission uses its own shape (called out in the event reference)
signatures:
  header: 'X-ListingsAPI-Signature: sha256=<digest>'
  digest: base64(HMAC-SHA256(secret, raw_request_body))
  verification_challenge: >-
    One-time endpoint verification handshake answers with a lowercase HEX HMAC digest in the
    body - base64 in the header, hex in the challenge reply. Docs flag the base64-vs-hex mixup
    as the single most common integration bug (a wrong encoding yields a permanently
    "unverified" endpoint with no error).
delivery:
  attempts: 1
  timeout_seconds: 5
  retries: none
  note: >-
    One HTTP POST attempt with a 5-second response budget and no retries; failed-gate attempts
    are still recorded with a status. Receivers should ack fast and process async.

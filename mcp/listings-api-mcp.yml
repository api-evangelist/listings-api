transport: streamable-http
description: 'Official hosted MCP server for the Listings API. Streamable HTTP at https://listingsapi.com/mcp
  - nothing to install. Authenticates with "Authorization: API <key>" (dev-portal API key) or OAuth 2.0
  Bearer tokens: the server publishes RFC 8414 authorization-server metadata and RFC 9728 protected-resource
  metadata at /.well-known/ on listingsapi.com (scopes read/write, PKCE S256, dynamic client registration;
  OAuth consent creates an API key named after the client). Exposes the local-marketing surface (locations,
  listings and citations, reviews and replies, Google Business Profile / Facebook posts, per-publisher
  analytics, connected-account flows) plus docs search, OpenAPI introspection, and dev-portal control-plane
  tools.'
